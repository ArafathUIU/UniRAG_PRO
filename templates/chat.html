<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unirag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --ink: #1B2B26;
    --bottle: #1F3A34;
    --bottle-deep: #16281F;
    --ivory: #F1EAD9;
    --card: #FBF7EE;
    --brass: #B08D57;
    --oxblood: #8C3F2C;
    --oxblood-bright: #B0523A;
    --line: rgba(176, 141, 87, 0.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at top left, #24443C 0%, var(--bottle-deep) 55%);
    font-family: "IBM Plex Sans", sans-serif;
    color: var(--ivory);
    display: flex;
    justify-content: center;
    padding: 32px 16px 64px;
  }

  .room {
    width: 100%;
    max-width: 900px;
  }

  .letterhead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1px solid var(--line);
    padding-bottom: 18px;
    margin-bottom: 22px;
  }

  .letterhead h1 {
    font-family: "Fraunces", serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 2.2rem;
    margin: 0;
    letter-spacing: 0.01em;
  }

  .letterhead p {
    margin: 4px 0 0;
    font-size: 0.9rem;
    opacity: 0.75;
    font-style: italic;
  }

  .stamp {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.62rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--oxblood-bright);
    border: 1.5px solid var(--oxblood-bright);
    border-radius: 4px;
    padding: 7px 10px;
    transform: rotate(-3deg);
    opacity: 0.9;
    white-space: nowrap;
    position: relative;
  }
  .stamp::before {
    content: "";
    position: absolute;
    inset: 3px;
    border: 1px dashed var(--oxblood-bright);
    border-radius: 2px;
    opacity: 0.5;
  }
  .stamp .stamp-value { display: block; color: var(--ivory); margin-top: 2px; font-size: 0.7rem; }

  .catalog {
    background: linear-gradient(180deg, rgba(251,247,238,0.03), rgba(251,247,238,0.01));
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px;
  }

  #chat-log {
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 380px;
    max-height: 60vh;
    overflow-y: auto;
    padding: 4px 4px 8px;
  }

  #chat-log:empty::before {
    content: "Ask UniRAG anything about university admissions, programs, GPA requirements, or tuition fees...";
    font-style: italic;
    opacity: 0.5;
    font-size: 0.95rem;
  }

  .card {
    max-width: 88%;
    padding: 14px 18px;
    border-radius: 6px;
    line-height: 1.6;
    font-size: 0.95rem;
    position: relative;
    box-shadow: 0 1px 0 rgba(0,0,0,0.15);
  }

  .card.user {
    align-self: flex-end;
    background: var(--oxblood);
    color: var(--ivory);
    border-top-right-radius: 12px;
  }

  .card.bot {
    align-self: flex-start;
    background: var(--card);
    color: var(--ink);
    border-top-left-radius: 12px;
    border-left: 3px solid var(--brass);
  }

  .card-content p { margin: 0 0 8px 0; }
  .card-content p:last-child { margin-bottom: 0; }
  .card-content ul, .card-content ol { margin: 6px 0 8px 0; padding-left: 20px; }
  .card-content li { margin-bottom: 4px; }
  .card-content h1, .card-content h2, .card-content h3, .card-content h4 { font-family: "Fraunces", serif; margin: 12px 0 6px 0; font-size: 1.05rem; color: var(--bottle-deep); }
  .card-content h1:first-child, .card-content h2:first-child, .card-content h3:first-child { margin-top: 0; }
  .card-content table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 0.88rem; }
  .card-content th, .card-content td { border: 1px solid rgba(27,43,38,0.2); padding: 6px 10px; text-align: left; }
  .card-content th { background: rgba(176,141,87,0.15); font-weight: 600; }

  .card .tag {
    position: absolute;
    top: -9px;
    right: 12px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.58rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: var(--oxblood-bright);
    color: var(--ivory);
    padding: 2px 7px;
    border-radius: 3px;
  }

  .card.bot .tag {
    background: var(--bottle-deep);
  }

  #chat-form {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }

  #message {
    flex: 1;
    background: rgba(251,247,238,0.06);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--ivory);
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  #message:focus {
    border-color: var(--brass);
    background: rgba(251,247,238,0.1);
  }

  #message::placeholder {
    color: var(--ivory);
    opacity: 0.45;
  }

  #send-btn {
    background: var(--brass);
    color: var(--bottle-dark);
    border: none;
    border-radius: 8px;
    padding: 12px 22px;
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }

  #send-btn:hover {
    background: var(--brass-light);
  }

  #send-btn:active {
    transform: scale(0.98);
  }

  #send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #send-btn.stop-mode {
    background: var(--oxblood-bright);
    color: var(--ivory);
  }

  #send-btn.stop-mode:hover {
    background: var(--oxblood);
  }

  #mic-btn, #attach-btn {
    background: rgba(251, 247, 238, 0.08);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--ivory);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
  }

  #mic-btn:hover, #attach-btn:hover {
    background: rgba(251, 247, 238, 0.15);
    border-color: var(--brass);
  }

  #mic-btn:active, #attach-btn:active {
    transform: scale(0.96);
  }

  #mic-btn.listening {
    background: var(--oxblood-bright);
    color: var(--ivory);
    border-color: var(--oxblood-bright);
    animation: mic-pulse 1.4s infinite ease-in-out;
  }

  #mic-btn svg, #attach-btn svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }

  #mic-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    border-color: rgba(176, 141, 87, 0.2);
  }

  #attachment-preview {
    display: none;
    align-items: flex-start;
    gap: 8px;
    background: rgba(27, 43, 38, 0.7);
    border: 1px dashed var(--brass);
    border-radius: 6px;
    padding: 8px 12px;
    margin-top: 10px;
    font-size: 0.85rem;
    color: var(--ivory);
  }

  #attachment-preview.active {
    display: flex;
  }

  #attachment-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    flex: 1;
  }

  .file-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(176, 141, 87, 0.18);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 4px 6px 4px 10px;
    max-width: 260px;
  }

  .file-chip .chip-name {
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 200px;
  }

  .file-chip .chip-size {
    opacity: 0.6;
    font-size: 0.75rem;
    white-space: nowrap;
  }

  .remove-file {
    background: none;
    border: none;
    color: var(--oxblood-bright);
    font-weight: bold;
    cursor: pointer;
    padding: 0 4px;
    font-size: 1.05rem;
    line-height: 1;
  }

  .remove-file:hover {
    color: #e57373;
  }

  .clear-all-files {
    background: none;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ivory);
    opacity: 0.75;
    cursor: pointer;
    font-size: 0.72rem;
    padding: 4px 8px;
    white-space: nowrap;
    align-self: center;
  }

  .clear-all-files:hover {
    opacity: 1;
    border-color: var(--oxblood-bright);
    color: var(--oxblood-bright);
  }

  .card-attachments {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 8px;
  }

  .att-thumb {
    max-width: 200px;
    max-height: 150px;
    border-radius: 8px;
    border: 1px solid rgba(0, 0, 0, 0.25);
    display: block;
  }

  .att-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(0, 0, 0, 0.18);
    border-radius: 14px;
    padding: 4px 12px;
    font-size: 0.8rem;
    max-width: 240px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .card.typing {
    display: flex;
    gap: 5px;
    align-items: center;
    padding: 18px;
  }

  .card.typing .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--bottle-deep);
    animation: typing-bounce 1.2s infinite ease-in-out;
  }
  .card.typing .dot:nth-child(2) { animation-delay: 0.15s; }
  .card.typing .dot:nth-child(3) { animation-delay: 0.3s; }

  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
    30% { transform: translateY(-5px); opacity: 0.9; }
  }

  @keyframes mic-pulse {
    0% {
      box-shadow: 0 0 0 0 rgba(176, 82, 58, 0.7);
    }
    70% {
      box-shadow: 0 0 0 10px rgba(176, 82, 58, 0);
    }
    100% {
      box-shadow: 0 0 0 0 rgba(176, 82, 58, 0);
    }
  }

  @media (max-width: 480px) {
    .letterhead { flex-direction: column; align-items: flex-start; gap: 10px; }
    .card { max-width: 92%; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="room">
    <div class="letterhead">
      <div>
        <h1>UniRAG</h1>
        <p>Self-Updating AI Knowledge Assistant for University Admissions & Academics</p>
      </div>
      <div class="stamp" id="freshness-stamp">
        Checking shelf…
      </div>
    </div>

    <div class="catalog">
      <div id="chat-log"></div>
      
      <div id="attachment-preview">
        <div id="attachment-list"></div>
        <button type="button" class="clear-all-files" id="clear-files-btn" title="Remove all attachments">Clear all</button>
      </div>

      <form id="chat-form">
        <button type="button" id="attach-btn" title="Attach files (PDF, DOC, images, TXT — multiple allowed, any type)" aria-label="Attach files">
          <svg viewBox="0 0 24 24" id="paperclip-icon">
            <path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/>
          </svg>
        </button>
        <input type="file" id="file-input" multiple style="display: none;">

        <input type="text" id="message" placeholder="Ask UniRAG anything or attach files..." autocomplete="off">

        <button type="button" id="mic-btn" title="Speak your query" aria-label="Voice input microphone">
          <svg viewBox="0 0 24 24" id="mic-icon">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
        <button type="submit" id="send-btn">Send</button>
      </form>
    </div>
  </div>

<script>
const form = document.getElementById("chat-form");
const input = document.getElementById("message");
const log = document.getElementById("chat-log");
const sendBtn = document.getElementById("send-btn");
const micBtn = document.getElementById("mic-btn");
const attachBtn = document.getElementById("attach-btn");
const fileInput = document.getElementById("file-input");
const previewContainer = document.getElementById("attachment-preview");
const attachmentList = document.getElementById("attachment-list");
const clearFilesBtn = document.getElementById("clear-files-btn");
const stamp = document.getElementById("freshness-stamp");

// Files accumulate here across multiple picks so the user can add them
// one-by-one (or in batches) and remove individual ones before sending.
let selectedFiles = [];

// File Attachment Logic
attachBtn.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", () => {
  for (const f of fileInput.files) {
    // De-dupe by name + size so re-picking the same file doesn't double it.
    const dup = selectedFiles.some(x => x.name === f.name && x.size === f.size);
    if (!dup) selectedFiles.push(f);
  }
  // Reset so selecting the same file again (after removing) still fires change.
  fileInput.value = "";
  renderAttachments();
});

clearFilesBtn.addEventListener("click", () => clearAttachment());

function formatKb(bytes) {
  return (bytes / 1024).toFixed(1) + " KB";
}

function renderAttachments() {
  attachmentList.innerHTML = "";
  if (selectedFiles.length === 0) {
    previewContainer.classList.remove("active");
    return;
  }
  previewContainer.classList.add("active");
  selectedFiles.forEach((f, idx) => {
    const chip = document.createElement("span");
    chip.className = "file-chip";

    const name = document.createElement("span");
    name.className = "chip-name";
    name.textContent = "📎 " + f.name;
    name.title = f.name;

    const size = document.createElement("span");
    size.className = "chip-size";
    size.textContent = formatKb(f.size);

    const rm = document.createElement("button");
    rm.type = "button";
    rm.className = "remove-file";
    rm.textContent = "×";
    rm.title = "Remove " + f.name;
    rm.addEventListener("click", () => {
      selectedFiles.splice(idx, 1);
      renderAttachments();
    });

    chip.appendChild(name);
    chip.appendChild(size);
    chip.appendChild(rm);
    attachmentList.appendChild(chip);
  });
}

function clearAttachment() {
  selectedFiles = [];
  fileInput.value = "";
  renderAttachments();
}

// Web Speech API
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
  micBtn.disabled = true;
  micBtn.title = "Speech recognition is not supported in this browser";
} else {
  const recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = "en-US";

  let isListening = false;

  micBtn.addEventListener("click", () => {
    if (isListening) {
      recognition.stop();
    } else {
      try {
        recognition.start();
      } catch (err) {
        console.error("Speech recognition start error:", err);
      }
    }
  });

  recognition.onstart = () => {
    isListening = true;
    micBtn.classList.add("listening");
    micBtn.title = "Listening... click to stop";
  };

  recognition.onresult = (event) => {
    let transcript = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    input.value = transcript;
  };

  recognition.onerror = (event) => {
    console.warn("Speech recognition error:", event.error);
    stopListeningUI();
    if (event.error === "not-allowed") {
      alert("Microphone permission was denied. Please allow microphone access in your browser settings.");
    }
  };

  recognition.onend = () => {
    stopListeningUI();
  };

  function stopListeningUI() {
    isListening = false;
    micBtn.classList.remove("listening");
    micBtn.title = "Speak your query";
  }
}

function addCard(text, sender, tag, attachments) {
  const div = document.createElement("div");
  div.className = "card " + sender;

  // Show attached images/files inside the message card, like other LLM chats
  if (attachments && attachments.length > 0) {
    const attDiv = document.createElement("div");
    attDiv.className = "card-attachments";
    for (const f of attachments) {
      if (f.type && f.type.startsWith("image/")) {
        const img = document.createElement("img");
        img.className = "att-thumb";
        img.alt = f.name;
        img.title = f.name;
        const objUrl = URL.createObjectURL(f);
        img.src = objUrl;
        img.onload = () => URL.revokeObjectURL(objUrl);
        attDiv.appendChild(img);
      } else {
        const pill = document.createElement("span");
        pill.className = "att-pill";
        pill.textContent = "📄 " + f.name;
        pill.title = f.name;
        attDiv.appendChild(pill);
      }
    }
    div.appendChild(attDiv);
  }

  if (text) {
    const contentDiv = document.createElement("div");
    contentDiv.className = "card-content";
    if (sender === "bot" && typeof marked !== "undefined") {
      contentDiv.innerHTML = marked.parse(text);
    } else {
      contentDiv.textContent = text;
    }
    div.appendChild(contentDiv);
  }

  if (tag) {
    const tagEl = document.createElement("span");
    tagEl.className = "tag";
    tagEl.textContent = tag;
    div.appendChild(tagEl);
  }
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function addTypingCard() {
  const div = document.createElement("div");
  div.className = "card bot typing";
  for (let i = 0; i < 3; i++) {
    const dot = document.createElement("span");
    dot.className = "dot";
    div.appendChild(dot);
  }
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

async function loadFreshness() {
  try {
    const res = await fetch("/status/");
    const data = await res.json();
    if (data.last_updated) {
      const d = new Date(data.last_updated);
      const dateStr = d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
      stamp.innerHTML = "Shelves stamped<span class='stamp-value'>" + dateStr + " · " + data.source_count + " sources</span>";
    } else {
      stamp.innerHTML = "Shelves empty<span class='stamp-value'>no scrape yet</span>";
    }
  } catch (err) {
    stamp.innerHTML = "Shelf status<span class='stamp-value'>unavailable</span>";
  }
}
loadFreshness();

let sessionId = localStorage.getItem("chat_session_id");
if (!sessionId) {
  sessionId = "sess_" + Math.random().toString(36).substring(2, 11) + "_" + Date.now();
  localStorage.setItem("chat_session_id", sessionId);
}

// --- Generation state / stop control ---
let currentController = null;
let isGenerating = false;

function setGenerating(on) {
  isGenerating = on;
  if (on) {
    sendBtn.textContent = "Stop";
    sendBtn.classList.add("stop-mode");
    sendBtn.title = "Stop generating";
  } else {
    sendBtn.textContent = "Send";
    sendBtn.classList.remove("stop-mode");
    sendBtn.title = "";
  }
}

// While generating, the Send button acts as a Stop button (aborts the request).
sendBtn.addEventListener("click", (e) => {
  if (isGenerating) {
    e.preventDefault();
    if (currentController) currentController.abort();
  }
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (isGenerating) return;
  const message = input.value.trim();
  const files = selectedFiles.slice();
  const hasFile = files.length > 0;
  if (!message && !hasFile) return;

  // The user's message card shows the attached images/files first,
  // then the bot replies — like other LLM chat UIs.
  addCard(message, "user", null, files);

  const formData = new FormData();
  formData.append("message", message);
  formData.append("session_id", sessionId);
  for (const f of files) {
    formData.append("files", f);
  }

  input.value = "";
  clearAttachment();
  currentController = new AbortController();
  setGenerating(true);
  const typingCard = addTypingCard();

  try {
    const res = await fetch("/chat/", {
      method: "POST",
      body: formData,
      signal: currentController.signal,
    });
    const data = await res.json();
    typingCard.remove();
    if (data.error) {
      addCard("Error: " + data.error, "bot");
    } else {
      let tag = "chitchat";
      if (data.intent === "ATTACHED_FILE") {
        tag = "from attached file";
      } else if (data.intent === "KNOWLEDGE") {
        tag = "from the shelves";
      }
      addCard(data.answer, "bot", tag);
    }
  } catch (err) {
    typingCard.remove();
    if (err.name === "AbortError") {
      addCard("_⏹ Generation stopped._", "bot");
    } else {
      addCard("Request failed: " + err.message, "bot");
    }
  } finally {
    setGenerating(false);
    currentController = null;
  }
});
</script>
</body>
</html>
